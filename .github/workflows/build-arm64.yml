name: Build DevEco Studio PKGBUILD (arm64)

on:
  workflow_dispatch:
    inputs:
      mac_zip_url:
        description: URL to the Mac zip (devecostudio-mac-<ver>.zip)
        required: true
      cli_zip_url:
        description: URL to commandline-tools-linux-arm64-<ver>.zip
        required: true
      pkgver:
        description: 'Override pkgver (e.g. 26.0.0.821). Leave empty to use the value in PKGBUILD.'
        required: false
        default: ''
      mac_zip_sha256:
        description: 'SHA256 of the Mac zip. Leave empty to use the value in PKGBUILD.'
        required: false
        default: ''
      cli_zip_sha256:
        description: 'SHA256 of the commandline-tools zip. Leave empty to use the value in PKGBUILD.'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    # Runs build.sh directly on the runner (no container: archlinux images
    # are x86_64-only, and build.sh exists precisely to run the PKGBUILD on
    # any distro). Swap is added because nfpm's rpm packager builds the
    # whole cpio payload in memory and peaks at ~16 GB RSS.
    # NOTE: a pkgver override also changes the IDEA/CPython tarballs; their
    # checksums are enforced by build.sh and must match, so only override
    # pkgver for the same toolset versions.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: devecostudio

      - name: Add swap (nfpm rpm packaging needs ~16 GB RSS)
        run: |
          sudo rm -f /ci.swap
          sudo fallocate -l 14G /ci.swap
          sudo chmod 600 /ci.swap
          sudo mkswap /ci.swap >/dev/null
          sudo swapon /ci.swap
          free -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git jq libarchive-tools unzip \
            python3 binutils tar gzip curl gettext-base
          # official 7-Zip (APFS-capable): distro 7zip packages differ in
          # binary name, so install a pinned upstream arm64 build as `7z`
          curl -fL -o /tmp/7z.tar.xz https://github.com/ip7z/7zip/releases/download/26.03/7z2603-linux-arm64.tar.xz
          mkdir -p /tmp/7z
          tar -xJf /tmp/7z.tar.xz -C /tmp/7z 7zz
          sudo install /tmp/7z/7zz /usr/local/bin/7z
          7z i | grep -qi apfs && echo "7z OK (APFS-capable)"

      - name: Apply version and checksum overrides
        working-directory: devecostudio
        run: |
          if [[ -n "${{ inputs.pkgver }}" ]]; then
            sed -i "s/^pkgver=.*/pkgver=${{ inputs.pkgver }}/" PKGBUILD
            echo "pkgver overridden to ${{ inputs.pkgver }}"
          fi
          # the first "_sum_mac=" assignment is the aarch64 branch;
          # mac zip is _sum_mac, cli zip _sum_cli (the next line)
          line=$(grep -n "_sum_mac=" PKGBUILD | head -1 | cut -d: -f1)
          if [[ -n "${{ inputs.mac_zip_sha256 }}" ]]; then
            sed -i "${line}s|.*|  _sum_mac='${{ inputs.mac_zip_sha256 }}'|" PKGBUILD
            echo "mac zip sha256 overridden"
          fi
          if [[ -n "${{ inputs.cli_zip_sha256 }}" ]]; then
            sed -i "$((line+1))s|.*|  _sum_cli='${{ inputs.cli_zip_sha256 }}'|" PKGBUILD
            echo "cli zip sha256 overridden"
          fi

      - name: Download source archives
        working-directory: devecostudio
        run: |
          curl -fL \
            -o devecostudio-mac.zip \
            "${{ inputs.mac_zip_url }}" &

          curl -fL \
            -o commandline-tools-linux-arm64.zip \
            "${{ inputs.cli_zip_url }}" &

          wait
          ls -la devecostudio-mac.zip commandline-tools-linux-arm64.zip

      - name: Download nfpm (arm64 static binary)
        run: |
          curl -fL https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_arm64.tar.gz \
            | tar xz -C /tmp nfpm
          sudo install /tmp/nfpm /usr/local/bin/nfpm
          nfpm --version | grep -m1 GitVersion

      - name: Build and package
        working-directory: devecostudio
        run: |
          # full build: runs the PKGBUILD prepare()/package(), then produces
          # the distro-agnostic tarball + .deb + .rpm (nfpm)
          ./build.sh --deb --rpm

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: devecostudio-deb-arm64
          path: devecostudio/devecostudio_*_arm64.deb
          if-no-files-found: warn

      - name: Upload RPM package
        uses: actions/upload-artifact@v4
        with:
          name: devecostudio-rpm-arm64
          path: devecostudio/devecostudio-*.aarch64.rpm
          if-no-files-found: warn

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: devecostudio-tarball-arm64
          path: devecostudio/devecostudio-*-linux-arm64.tar.gz
          if-no-files-found: warn
