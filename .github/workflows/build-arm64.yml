name: Build DevEco Studio PKGBUILD (arm64)

on:
  workflow_dispatch:
    inputs:
      mac_zip_url:
        description: URL to the Mac zip (devecostudio-mac-<ver>.zip)
        required: true
      cli_zip_url:
        description: URL to commandline-tools-linux-arm64-<ver>.zip
        required: true
      pkgver:
        description: 'Override pkgver (e.g. 26.0.0.821). Leave empty to use the value in PKGBUILD.'
        required: false
        default: ''
      make_deb:
        description: 'Build the .deb'
        type: boolean
        default: true
      make_rpm:
        description: 'Build the .rpm (slowest)'
        type: boolean
        default: true
      make_tarball:
        description: 'Build the distro-agnostic tarball'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    # Same shape as the x86_64 workflow: build with the real makepkg inside
    # an Arch container, then package .deb/.rpm/tarball from the staging
    # tree it leaves behind — one build, four artifacts.
    #
    # The container is ogarcia/archlinux:devel, because aarch64 needs Arch
    # Linux ARM and none of the obvious images provide it:
    #   - Docker Hub's official `archlinux` / `archlinux:base-devel` publish
    #     amd64 manifests only (verified against the registry API);
    #   - lopsided/archlinux dropped its arm64v8 tag (404) and its `devel`
    #     tag is amd64-only now;
    #   - agners/archlinuxarm still has an arm64/v8 layer but was last
    #     pushed 2021-05-19.
    # ogarcia/archlinux is multiarch (amd64/arm64/armv7/riscv64), rebuilt
    # monthly, publishes date-pinned tags (2026.10.22-devel) and mirrors to
    # GitLab and Quay, so it can be pinned and audited. Its arm64 layer is
    # built from Arch Linux ARM, i.e. CARCH=aarch64 as needed here.
    # Otherwise this mirrors build.yml: same steps, same makepkg flags, same
    # packaging — only the image, the runner and the arm64 names differ.
    # NOTE: a pkgver override also changes the IDEA/CPython tarballs; their
    # checksums are enforced by makepkg and must match, so only override
    # pkgver for the same toolset versions.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: devecostudio

      - name: Add swap on the host (rpm packaging needs ~16 GB RSS)
        if: inputs.make_rpm
        run: |
          # host job: the runner user has passwordless sudo; a real swapfile
          # on the host is inherited by the build container below.
          sudo rm -f /ci.swap
          sudo fallocate -l 14G /ci.swap
          sudo chmod 600 /ci.swap
          sudo mkswap /ci.swap >/dev/null
          sudo swapon /ci.swap
          free -h

      - name: Apply pkgver override
        working-directory: devecostudio
        run: |
          if [[ -n "${{ inputs.pkgver }}" ]]; then
            sed -i "s/^pkgver=.*/pkgver=${{ inputs.pkgver }}/" PKGBUILD
            echo "pkgver overridden to ${{ inputs.pkgver }}"
          fi

      - name: Download source archives
        working-directory: devecostudio
        run: |
          curl -fL \
            -o devecostudio-mac.zip \
            "${{ inputs.mac_zip_url }}" &

          curl -fL \
            -o commandline-tools-linux-arm64.zip \
            "${{ inputs.cli_zip_url }}" &

          wait
          ls -la devecostudio-mac.zip commandline-tools-linux-arm64.zip

      - name: Build and package inside the Arch Linux ARM container
        env:
          MAKE_DEB: ${{ inputs.make_deb }}
          MAKE_RPM: ${{ inputs.make_rpm }}
          MAKE_TARBALL: ${{ inputs.make_tarball }}
        run: |
          docker run --rm \
            -e MAKE_DEB -e MAKE_RPM -e MAKE_TARBALL \
            -v "$GITHUB_WORKSPACE":/work -w /work \
            ogarcia/archlinux:devel bash -c '
            set -e
            echo "=== free -h (inside container) ==="
            free -h
            pacman -Syu --noconfirm
            # Same list as the x86_64 job: makepkg -s below installs the
            # remaining makedepends (python, patchelf) itself, and curl /
            # gettext come in as pacman dependencies.
            pacman -S --needed --noconfirm git jq p7zip sudo
            useradd -m builder
            echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
            chown -R builder:builder /work
            # -s matters: makepkg always verifies the runtime depends (libxss,
            # nss, alsa-lib, ...) and aborts with "Could not resolve all
            # dependencies" without it — this is not just about makedepends.
            # -s installs them from the ALARM repos, which needs sudo above.
            # no -c: --clean removes pkg/, which the packaging step needs.
            runuser -u builder -- bash -c "cd /work/devecostudio && makepkg -sf --noconfirm"
            # nfpm is not in the Arch repos; fetch the static arm64 binary
            # from the GitHub release (pinned version; update deliberately).
            if [[ $MAKE_DEB == true || $MAKE_RPM == true ]]; then
              curl -fL https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_arm64.tar.gz \
                | tar xz -C /usr/local/bin nfpm
              nfpm --version | grep -m1 GitVersion
            fi
            cd /work/devecostudio
            if [[ -d pkg/devecostudio ]]; then
              # --stage packages the existing makepkg tree; --deb/--rpm add
              # the nfpm packages and --no-tarball drops the gzip step.
              pkg_args=(--stage=pkg/devecostudio)
              if [[ $MAKE_DEB == true ]]; then pkg_args+=(--deb); fi
              if [[ $MAKE_RPM == true ]]; then pkg_args+=(--rpm); fi
              if [[ $MAKE_TARBALL != true ]]; then pkg_args+=(--no-tarball); fi
              ./build.sh "${pkg_args[@]}"
            else
              echo "pkg/devecostudio not found; skipping packages"
            fi
          '

      - name: Upload Arch package
        uses: actions/upload-artifact@v4
        with:
          name: devecostudio-arch-arm64
          path: devecostudio/devecostudio-*-aarch64.pkg.tar.zst
          if-no-files-found: error

      - name: Upload Debian package
        if: inputs.make_deb
        uses: actions/upload-artifact@v4
        with:
          name: devecostudio-deb-arm64
          path: devecostudio/devecostudio_*_arm64.deb
          if-no-files-found: warn

      - name: Upload RPM package
        if: inputs.make_rpm
        uses: actions/upload-artifact@v4
        with:
          name: devecostudio-rpm-arm64
          path: devecostudio/devecostudio-*.aarch64.rpm
          if-no-files-found: warn

      - name: Upload tarball
        if: inputs.make_tarball
        uses: actions/upload-artifact@v4
        with:
          name: devecostudio-tarball-arm64
          path: devecostudio/devecostudio-*-linux-arm64.tar.gz
          if-no-files-found: warn
